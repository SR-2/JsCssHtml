<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mouse Parallax</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
      font-family: Arial, sans-serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      perspective: 1000px;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      inset: -10%;
      background-size: cover;
      background-position: center;
      transition: transform 0.1s linear;
    }

    .layer.bg {
      background-image: url("https://picsum.photos/1600/900?blur=2");
    }

    .layer.mid {
      background-image: url("https://picsum.photos/1600/900?grayscale");
      mix-blend-mode: screen;
      opacity: 0.7;
    }

    .layer.front {
      background-image: url("https://picsum.photos/1600/900");
      opacity: 0.4;
    }

    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 4rem;
      z-index: 10;
      text-shadow: 0 20px 40px rgba(0,0,0,0.6);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="scene" id="scene">
    <div class="layer bg" data-depth="10"></div>
    <div class="layer mid" data-depth="25"></div>
    <div class="layer front" data-depth="40"></div>
    <div class="title">Mouse Parallax</div>
  </div>

  <script>
    const scene = document.getElementById("scene");
    const layers = document.querySelectorAll(".layer");

    scene.addEventListener("mousemove", (e) => {
      const { width, height } = scene.getBoundingClientRect();
      const x = e.clientX - width / 2;
      const y = e.clientY - height / 2;

      layers.forEach(layer => {
        const depth = layer.dataset.depth;
        const moveX = (x / width) * depth;
        const moveY = (y / height) * depth;

        layer.style.transform = `
          translate(${moveX}px, ${moveY}px)
        `;
      });
    });
  </script>

</body>
</html>
