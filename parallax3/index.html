<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Full WOW Parallax</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a0a0a, #000);
      font-family: 'Segoe UI', sans-serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      perspective: 1200px;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      inset: -15%;
      background-size: cover;
      background-position: center;
      will-change: transform;
    }

    .bg {
      background-image: url("https://picsum.photos/1920/1080?blur=3");
      filter: brightness(0.6);
    }

    .mid {
      background-image: url("https://picsum.photos/1920/1080?grayscale");
      mix-blend-mode: screen;
      opacity: 0.8;
    }

    .front {
      background-image: url("https://picsum.photos/1920/1080");
      opacity: 0.4;
    }

    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,255,255,0.15), transparent 60%);
      z-index: 5;
      pointer-events: none;
    }

    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 4.5rem;
      letter-spacing: 2px;
      z-index: 10;
      text-shadow:
        0 20px 50px rgba(0,0,0,0.7),
        0 0 40px rgba(0,255,255,0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="scene" id="scene">
    <div class="layer bg" data-depth="10"></div>
    <div class="layer mid" data-depth="25"></div>
    <div class="layer front" data-depth="45"></div>
    <div class="glow"></div>
    <div class="title">FULL WOW</div>
  </div>

  <script>
    const scene = document.getElementById("scene");
    const layers = document.querySelectorAll(".layer");

    let mouseX = 0;
    let mouseY = 0;
    let currentX = 0;
    let currentY = 0;

    scene.addEventListener("mousemove", (e) => {
      const rect = scene.getBoundingClientRect();
      mouseX = e.clientX - rect.left - rect.width / 2;
      mouseY = e.clientY - rect.top - rect.height / 2;
    });

    function animate() {
      currentX += (mouseX - currentX) * 0.08;
      currentY += (mouseY - currentY) * 0.08;

      layers.forEach(layer => {
        const depth = layer.dataset.depth;
        const moveX = (currentX / window.innerWidth) * depth;
        const moveY = (currentY / window.innerHeight) * depth;

        const rotateX = (-currentY / window.innerHeight) * 10;
        const rotateY = (currentX / window.innerWidth) * 10;

        layer.style.transform = `
          translate(${moveX}px, ${moveY}px)
          rotateX(${rotateX}deg)
          rotateY(${rotateY}deg)
          scale(1.1)
        `;
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
