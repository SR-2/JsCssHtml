<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Parallax</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 300vh;
      background: #111;
      color: white;
    }

    .parallax {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      width: 110%;
      height: 110%;
      background-position: center;
      background-size: cover;
    }

    .layer.bg {
      background-image: url("https://picsum.photos/1600/900?blur=2");
      z-index: 1;
    }

 

   

    .content {
      position: relative;
      z-index: 10;
      padding-top: 120vh;
      text-align: center;
      font-size: 3rem;
    }
  </style>
</head>
<body>

  <div class="parallax">
    <div class="layer bg" data-speed="0.2"></div>
    <div class="layer mid" data-speed="0.5"></div>
    <div class="layer front" data-speed="0.8"></div>
  </div>

  <div class="content">
    ✨ Efecto Parallax ✨
    <p style="font-size:1.5rem; margin-top:20px;">
      Scroll para ver la magia
    </p>
  </div>

  <script>
    const layers = document.querySelectorAll(".layer");

    window.addEventListener("scroll", () => {
      const scrollY = window.scrollY;

      layers.forEach(layer => {
        const speed = layer.dataset.speed;
        layer.style.transform = `translateY(${scrollY * speed}px)`;
      });
    });
  </script>

</body>
</html>
